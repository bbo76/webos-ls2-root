<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101820">
    <title>webOS LS2 · Bootstrap</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: "LG Smart UI", "Segoe UI", Arial, sans-serif;
            background: #101820;
            color: #f4f7f8;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            --surface: #1b2730;
            --line: #34434d;
            --subtle: #afbdc4;
            --cyan: #63e6e2;
            --green: #70e0a0;
            --amber: #ffd166;
            --red: #ff8585;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: clamp(28px, 5vh, 64px) clamp(28px, 6vw, 96px);
            background: #101820;
        }

        main { width: min(100%, 1280px); margin: 0 auto; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 32px;
            margin-bottom: clamp(32px, 6vh, 68px);
        }

        h1 {
            margin: 0;
            font-size: clamp(34px, 4vw, 52px);
            font-weight: 600;
            letter-spacing: -.035em;
        }

        header p { margin: 10px 0 0; color: var(--subtle); font-size: 20px; }
        .version { color: var(--subtle); font-size: 16px; white-space: nowrap; }

        .status-board {
            padding: 8px 32px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
        }

        .line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            min-height: 76px;
            border-bottom: 1px solid var(--line);
            font-size: clamp(19px, 2vw, 25px);
        }

        .line:last-child { border-bottom: 0; }
        .line strong { font-weight: 600; text-align: right; }
        .ok { color: var(--green); }
        .warn { color: var(--amber); }
        .err { color: var(--red); }
        .muted { color: var(--subtle); }

        .slider-panel {
            --slider-progress: 0%;
            --rail-idle: #53666f;
            margin-top: 28px;
            padding: clamp(28px, 4vw, 52px) clamp(24px, 5vw, 64px);
            background: #24343d;
            border: 1px solid #40545d;
            border-radius: 20px;
            text-align: center;
        }

        #slider-label {
            display: block;
            margin-bottom: 16px;
            font-size: clamp(26px, 3vw, 38px);
            font-weight: 600;
            letter-spacing: -.025em;
        }

        #start-slider {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 108px;
            margin: 8px 0 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        #start-slider::-webkit-slider-runnable-track {
            height: 1px;
            background: transparent;
        }

        #start-slider::-webkit-slider-thumb {
            width: 76px;
            height: 76px;
            margin-top: -37px;
            background: transparent;
            border: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider-track {
            position: relative;
            height: 108px;
            padding: 0 36px;
            --fill-scale: 0;
            --fill-color: var(--cyan);
        }

        .slider-track::before,
        .slider-track::after {
            position: absolute;
            z-index: 1;
            top: 50%;
            left: 36px;
            content: "";
            pointer-events: none;
            transform: translateY(-50%);
        }

        .slider-track::before {
            right: 36px;
            height: 20px;
            background: #53666f;
            border: 2px solid rgba(231, 247, 247, .7);
            border-radius: 20px;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, .34), 0 4px 12px rgba(0, 0, 0, .2);
        }

        .slider-track::after {
            right: 36px;
            height: 12px;
            background: linear-gradient(90deg, #40bfc0, #8bfff1);
            border-radius: 12px;
            transform: translateY(-50%) scaleX(var(--fill-scale));
            transform-origin: left center;
            transition: transform 120ms ease-out, background 220ms ease-out;
        }

        .slider-thumb {
            position: absolute;
            z-index: 3;
            top: 50%;
            left: 36px;
            display: grid;
            width: 76px;
            height: 76px;
            place-items: center;
            pointer-events: none;
            background: linear-gradient(145deg, #a9fff4, #4bd5d4 56%, #1c9eaa);
            border: 5px solid #efffff;
            border-radius: 26px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, .4), inset 0 2px 5px rgba(255, 255, 255, .35);
            transform: translate(-50%, -50%);
        }

        .slider-thumb::before {
            width: 18px;
            height: 22px;
            content: "";
            background: #124d57;
            clip-path: polygon(0 0, 42% 0, 100% 50%, 42% 100%, 0 100%, 58% 50%);
        }

        .slider-panel.is-ready:not(.is-engaged) .slider-thumb {
            animation: unlock-invite 1.25s cubic-bezier(.16, 1, .3, 1) 2 both;
        }

        @keyframes unlock-invite {
            0%, 100% { transform: translate(-50%, -50%); }
            58% { transform: translate(-50%, -50%) translateX(84px); }
        }

        .slider-panel.is-ready:not(.is-engaged) .slider-thumb::before {
            animation: arrow-shift 1.25s ease-out 2 both;
        }

        @keyframes arrow-shift {
            0%, 100% { opacity: 1; transform: translateX(0); }
            58% { opacity: .55; transform: translateX(2px); }
        }

        .slider-panel.is-complete .slider-track { --fill-scale: 1; }
        .slider-panel.is-complete .slider-track::after { background: linear-gradient(90deg, #49d897, #a5f4c5); }
        .slider-panel.is-complete .slider-thumb { background: linear-gradient(145deg, #a5f4c5, #49d897); }

        #start-slider:focus { outline: 4px solid var(--cyan); outline-offset: -7px; border-radius: 30px; }
        #start-slider:disabled { cursor: default; opacity: .5; }
        #slider-progress { margin-top: 4px; color: var(--cyan); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .help { margin: 14px 0 0; color: var(--subtle); font-size: 18px; }

        .log-section { margin-top: 32px; }
        h2 { margin: 0 0 14px; font-size: 21px; font-weight: 600; }

        pre {
            min-height: 96px;
            max-height: 220px;
            margin: 0;
            overflow: auto;
            padding: 18px 22px;
            background: #0b1218;
            color: #c6d7dc;
            border: 1px solid #293943;
            border-radius: 12px;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        ::selection { background: #245b61; color: #fff; }
        :focus-visible { outline-color: var(--cyan); }

        @media (max-width: 700px) {
            body { padding: 24px 20px; }
            header { margin-bottom: 30px; }
            .status-board { padding: 4px 18px; }
            .line { min-height: 64px; font-size: 18px; }
            .slider-panel { margin-top: 18px; }
            .help { font-size: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .slider-panel.is-ready .slider-thumb,
            .slider-panel.is-ready .slider-thumb::before { animation: none; }
            .slider-track::after { transition: none; }
        }
    </style>
</head>

<body>
    <!--
        THESIS: A webOS setup screen where each step's result is the clearest thing on screen.
        OWN-WORLD: Deep blue-green TV surfaces, crisp system type, cyan control focus, semantic result colors.
        STORY: Check the bridge and session, move the remote slider, then read registration and root verification separately.
        FIRST VIEWPORT: Header above a four-row status board; a broad central slide-to-unlock control; a compact execution log below.
        FORM: Grounded direction 3 of 7; degraded seed 683c58b1, no challengers available.
        FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <main>

        <header>
            <div>
                <h1>webOS LS2 Bootstrap</h1>
                <p>LG webOS · Developer Mode</p>
            </div>
            <span class="version">V0.2</span>
        </header>

        <section class="status-board" aria-label="Bootstrap step results" aria-live="polite">
            <div class="line">
                <span>PalmServiceBridge</span>
                <strong id="bridge" class="muted">Checking...</strong>
            </div>

            <div class="line">
                <span>Local session</span>
                <strong id="session" class="muted">Initializing...</strong>
            </div>

            <div class="line">
                <span>Bootstrap LS2</span>
                <strong id="bootstrap" class="warn">Waiting</strong>
            </div>

            <div class="line">
                <span>Root verification</span>
                <strong id="root" class="muted">Not verified</strong>
            </div>
        </section>

        <section class="slider-panel" aria-label="Start bootstrap">
            <label id="slider-label" for="start-slider">
                Slide to start
            </label>

            <div class="slider-track">
                <input id="start-slider" type="range" min="0" max="100" step="10" value="0" aria-valuetext="0 percent" disabled>
                <span class="slider-thumb" aria-hidden="true"></span>
            </div>

            <output id="slider-progress" for="start-slider">0%</output>

            <div class="help">
                Use the Magic Remote or the left/right arrow keys.
            </div>
        </section>

        <section class="log-section" aria-label="Execution log">
            <h2>Execution log</h2>
            <pre id="logs"></pre>
        </section>

    </main>

    <script>
        (function () {
            "use strict";

            function $(id) {
                return document.getElementById(id);
            }

            var slider = $("start-slider");
            var sliderPanel = document.querySelector(".slider-panel");
            var progress = $("slider-progress");
            var sliderLabel = $("slider-label");

            var bridgeStatus = $("bridge");
            var sessionStatus = $("session");
            var bootstrapStatus = $("bootstrap");
            var rootStatus = $("root");
            var logs = $("logs");

            var query = new URLSearchParams(location.search);
            var token = query.get("token");

            var started = false;

            function log(message) {
                var timestamp = new Date().toLocaleTimeString();

                logs.textContent +=
                    "[" + timestamp + "] " + message + "\n";

                logs.scrollTop = logs.scrollHeight;
            }

            function setStatus(element, value, className) {
                element.textContent = value;
                element.className = className;
            }

            function updateSlider(value) {
                var percent = Number(value);
                var track = slider.parentElement;
                track.style.setProperty("--fill-scale", percent / 100);
                track.querySelector(".slider-thumb").style.left =
                    (36 + (track.clientWidth - 72) * percent / 100) + "px";
                slider.setAttribute("aria-valuetext", percent + " percent");
                progress.textContent = percent + "%";
            }

            function report(state, message) {
                if (!token) {
                    log("ERROR: missing session token");
                    return Promise.reject(
                        new Error("Missing session token")
                    );
                }

                return fetch(
                    "/status?token=" + encodeURIComponent(token),
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            state: state,
                            message: message
                        })
                    }
                ).then(function (response) {
                    if (!response.ok) {
                        throw new Error(
                            "HTTP " + response.status
                        );
                    }
                });
            }

            // ==================================================
            // LS2 REGISTRATION — EXTENSION POINT
            // ==================================================

            function registerManifest() {
                log("LS2 registration requested");
                var uri = "luna://com.webos.service.bus/addManifestsDir";
                var prefix = "/media/developer/temp/ls2root-v01";
                var dirpath = "reference-test";
                var parameters = { prefix: prefix, dirpath: dirpath };
                var label = "Load";

                return new Promise(function (resolve, reject) {
                    if (typeof window.PalmServiceBridge !== "function") {
                        var unavailable = new Error("PalmServiceBridge is unavailable. Open this page in tinybrowser on the webOS TV.");
                        log(label + " — error: " + unavailable.message); reject(unavailable); return;
                    }
                    var settled = false;
                    var bridge;
                    function finish(callback, value) { if (!settled) { settled = true; callback(value); } }
                    try {
                        bridge = new window.PalmServiceBridge();
                        bridge.onservicecallback = function (response) {
                            var payload;

                            try {
                                payload = JSON.parse(response);
                            } catch (error) {
                                finish(
                                    reject,
                                    new Error("Invalid LS2 response: " + response)
                                );
                                return;
                            }

                            log("LS2 response: " + JSON.stringify(payload));

                            if (payload.returnValue !== true) {
                                finish(
                                    reject,
                                    new Error(payload.errorText || "LS2 call failed")
                                );
                                return;
                            }

                            finish(resolve, payload);
                        };
                        var accepted = bridge.call(uri, JSON.stringify(parameters));
                        if (accepted === false) {
                            var refused = new Error("PalmServiceBridge.call rejected the request.");
                            log(label + " — error: " + refused.message);
                        } else log(
                            label + " — sent: " +
                            JSON.stringify({ uri: uri, parameters: parameters })
                        );
                    } catch (error) {
                        log(label + " — error", { message: error && error.message ? error.message : String(error) }, true);
                        finish(reject, error);
                    }
                });
            }

            // ==================================================
            // BOOTSTRAP WORKFLOW
            // ==================================================

            function watchRootVerification() {
                var lastState = "";

                function poll() {
                    if (!token) return;

                    fetch("/result?token=" + encodeURIComponent(token), {
                        cache: "no-store"
                    })
                        .then(function (response) {
                            if (!response.ok) {
                                throw new Error("HTTP " + response.status);
                            }
                            return response.json();
                        })
                        .then(function (result) {
                            if (result.state !== lastState) {
                                lastState = result.state;

                                if (result.state === "registered") {
                                    setStatus(rootStatus, "Verifying...", "warn");
                                    log("Manifest registered. Verifying root access on Mac...");
                                }

                                if (result.state === "verified") {
                                    setStatus(rootStatus, "ROOT OK", "ok");
                                    setStatus(bootstrapStatus, "Complete", "ok");

                                    sliderLabel.textContent = "Bootstrap successful!";
                                    sliderPanel.classList.add("is-complete");
                                    log("SUCCESS: root execution confirmed by Mac");
                                    return;
                                }

                                if (result.state === "error") {
                                    setStatus(rootStatus, "Failed", "err");
                                    log("ERROR: " + (result.message || "Failed"));
                                    return;
                                }
                            }

                            setTimeout(poll, 1000);
                        })
                        .catch(function (error) {
                            log("Status check: " + error.message);
                            setTimeout(poll, 2000);
                        });
                }

                poll();
            }


            function startBootstrap() {
                if (started) {
                    return;
                }

                started = true;
                slider.disabled = true;

                sliderLabel.textContent = "Bootstrap in progress...";

                setStatus(
                    bootstrapStatus,
                    "In progress",
                    "warn"
                );

                setStatus(
                    rootStatus,
                    "Waiting",
                    "muted"
                );

                log("Slider reached 100%");

                report("running", "Bootstrap started")
                    .then(function () {
                        return registerManifest();
                    })
                    .then(function () {
                        log("LS2 registration confirmed");

                        setStatus(
                            bootstrapStatus,
                            "Registered",
                            "ok"
                        );

                        setStatus(
                            rootStatus,
                            "Verifying on Mac",
                            "warn"
                        );

                        return report(
                            "registered",
                            "LS2 manifest registered"
                        );
                    })
                    .catch(function (error) {
                        var message = error && error.message
                            ? error.message
                            : String(error);

                        log("ERROR: " + message);

                        setStatus(
                            bootstrapStatus,
                            "Failed",
                            "err"
                        );

                        report("error", message)
                            .catch(function (reportError) {
                                log(
                                    "Communication error: " +
                                    reportError.message
                                );
                            });
                    });
            }

            // ==================================================
            // INITIALIZATION
            // ==================================================

            if (typeof PalmServiceBridge === "undefined") {
                setStatus(
                    bridgeStatus,
                    "Unavailable",
                    "err"
                );

                setStatus(
                    bootstrapStatus,
                    "Blocked",
                    "err"
                );

                log("PalmServiceBridge not found");

                report(
                    "error",
                    "PalmServiceBridge unavailable"
                ).catch(function () { });

                return;
            }

            setStatus(bridgeStatus, "Available", "ok");

            log("PalmServiceBridge available");

            if (!token) {
                setStatus(
                    sessionStatus,
                    "Missing token",
                    "err"
                );

                log("Server session unavailable");
                return;
            }

            setStatus(
                sessionStatus,
                "Connected",
                "ok"
            );

            slider.disabled = false;
            sliderPanel.classList.add("is-ready");

            log("Interface initialized");
            log("Waiting for confirmation");
            watchRootVerification();

            slider.addEventListener("input", function () {
                sliderPanel.classList.add("is-engaged");
                updateSlider(slider.value);

                if (Number(slider.value) >= 100) {
                    startBootstrap();
                }
            });

            slider.addEventListener("change", function () {
                sliderPanel.classList.add("is-engaged");
                updateSlider(slider.value);

                if (Number(slider.value) >= 100) {
                    startBootstrap();
                }
            });

        })();
    </script>

</body>

</html>
